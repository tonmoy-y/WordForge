<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="shadow" x="0" y="80" width="300" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="3" dy="10" stdDeviation="12" flood-color="#051c42" flood-opacity="0.35"/>
    </filter>
    <clipPath id="backPlateClip">
      <rect x="110" y="16" width="386" height="480" rx="44" fill="#fff"/>
    </clipPath>
  </defs>

  <!-- Background Document with 5 tiered blue bands -->
  <g clip-path="url(#backPlateClip)">
    <rect x="110" y="16" width="386" height="96" fill="#2B82E8"/>
    <rect x="110" y="112" width="386" height="96" fill="#1E6FD9"/>
    <rect x="110" y="208" width="386" height="96" fill="#1658C0"/>
    <rect x="110" y="304" width="386" height="96" fill="#0F47A4"/>
    <rect x="110" y="400" width="386" height="96" fill="#0B3785"/>
  </g>

  <!-- Foreground Square Badge with Drop Shadow -->
  <g filter="url(#shadow)">
    <rect x="16" y="112" width="256" height="256" rx="38" fill="#185ABD"/>
  </g>

  <!-- Clean Bold W Icon Glyph -->
  <path d="M54 180 H88 L116 288 L144 180 H174 L202 288 L230 180 H264 L221 324 H188 L159 216 L130 324 H97 Z" fill="#FFFFFF"/>
</svg>
