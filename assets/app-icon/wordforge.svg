<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background page gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>

    <!-- Page folded corner gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Foreground badge gradient (Rich WordForge Royal Blue) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#216FED"/>
      <stop offset="100%" stop-color="#083D94"/>
    </linearGradient>

    <!-- Subtle inner bevel highlight -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="pageShadow" x="-15%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#092147" flood-opacity="0.20"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-15%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="14" stdDeviation="16" flood-color="#041635" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 1. Background Layer: Document Page with Folded Corner -->
  <g filter="url(#pageShadow)">
    <path d="M176 40 
             H 370 
             L 450 120 
             V 424 
             C 450 444 434 460 414 460 
             H 176 
             C 156 460 140 444 140 424 
             V 76 
             C 140 56 156 40 176 40 Z" 
          fill="url(#pageGrad)"/>
    
    <!-- Dog-ear fold flap -->
    <path d="M 370 40 
             V 104 
             C 370 113 377 120 386 120 
             H 450 
             Z" 
          fill="url(#foldGrad)"/>
    
    <!-- Blueprint / document styling lines -->
    <rect x="256" y="160" width="144" height="10" rx="5" fill="#3B82F6" opacity="0.32"/>
    <rect x="256" y="195" width="154" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="256" y="230" width="134" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="256" y="265" width="148" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="256" y="300" width="124" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="180" y="340" width="220" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="180" y="375" width="190" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
    <rect x="180" y="410" width="140" height="10" rx="5" fill="#3B82F6" opacity="0.22"/>
  </g>

  <!-- 2. Foreground Layer: Overlapping WordForge Badge Tile -->
  <g filter="url(#badgeShadow)">
    <!-- Rounded squircle badge: 240x240 at x=52, y=136, rx=48 (center = 172, 256) -->
    <rect x="52" y="136" width="240" height="240" rx="48" fill="url(#badgeGrad)"/>
    <rect x="52" y="136" width="240" height="240" rx="48" fill="none" stroke="url(#bevelGrad)" stroke-width="2"/>
    
    <!-- 3. Perfectly Centered, Crisp, Bold White "W" -->
    <path d="M 96 194 L 120 194 L 145 286 L 161 194 L 183 194 L 199 286 L 224 194 L 248 194 L 212 318 L 188 318 L 172 236 L 156 318 L 132 318 Z" 
          fill="#FFFFFF"/>
  </g>
</svg>
