[package]
name = "wordforge-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordForge rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
wordforge-geom = { workspace = true }
wordforge-doc = { workspace = true }
wordforge-fonts = { workspace = true }
wordforge-layout = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
